<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads Training</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Night theme: the choice is saved in this browser and applied before the page is drawn, so there is no white flash */
    (function () { var t = 'light'; try { t = localStorage.getItem('theme') || 'light'; } catch (e) {} document.documentElement.setAttribute('data-theme', t); })();
    function toggleTheme() {
      var root = document.documentElement, next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.classList.add('theme-anim'); root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      setTimeout(function () { root.classList.remove('theme-anim'); }, 350);
    }
  </script>
</head>
<body>
<!--
  HOW THIS FILE WORKS
  Every screen is a <template> below. JavaScript copies a template and fills it with data:
    data-text="key"        puts the value of "key" inside the element
    data-attr="href:key"   sets an attribute (several: "href:a; class:b")
    data-width="key"       sets the width of a progress bar (in %)
    data-class="key"       adds the class names stored in "key"
    data-value="key"       sets the value of an input, textarea or select
    data-show="key"        keeps the element only if "key" is true
    data-hide="key"        removes the element if "key" is true
    data-list="key"        repeats the inner <template> once for each item of "key"
    data-slot="name"       empty place where JavaScript inserts another template
  To change how a screen looks, edit its template here. Colors are in css/style.css.
-->
<div id="app"><p class="muted" style="padding:20px">Loading...</p></div>

<!-- ============ SHARED PIECES ============ -->
<template id="tpl-print">
  <div class="popup-overlay" id="printdlg" onclick="if(event.target===this)closePrint()">
    <div class="popup-box print-box" role="dialog" aria-modal="true">
      <h3 data-text="title"></h3>
      <div class="pf-title">What to print</div>
      <div class="pf-grid" id="pfields"></div>
      <p class="small pf-count"><b id="pcount"></b> <button type="button" class="linkbtn" onclick="printResetFields()">Reset filters</button></p>
      <div class="pf-title">Look</div>
      <div class="seg" role="group" aria-label="Print theme">
        <button type="button" class="seg-btn" id="pt-light" onclick="pickPrintTheme('light')">☀ Light mode</button>
        <button type="button" class="seg-btn" id="pt-dark" onclick="pickPrintTheme('dark')">🌙 Dark mode</button>
      </div>
      <p class="small muted">In the print window choose your printer, or "Save as PDF". For dark mode, tick "Background graphics" so the dark colours print.</p>
      <div class="row" style="justify-content:center"><button type="button" class="btn" onclick="runPrint()">Print</button><button type="button" class="btn ghost" onclick="closePrint()">Cancel</button></div>
    </div>
  </div>
</template>

<template id="tpl-popup">
  <div class="popup-overlay" id="popup" onclick="if(event.target===this)closePopup()">
    <div class="popup-box" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <div class="popup-icon" aria-hidden="true">✓</div>
      <h3 id="popup-title" data-text="title"></h3>
      <p data-text="text"></p>
      <button type="button" class="btn" onclick="closePopup()">OK</button>
    </div>
  </div>
</template>

<template id="tpl-confirm">
  <div class="popup-overlay" id="confirmdlg">
    <div class="popup-box confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="popup-icon" aria-hidden="true">?</div>
      <h3 id="confirm-title" data-text="title"></h3>
      <div class="popup-file" data-show="hasFile"><span class="popup-file-ic" aria-hidden="true">&#9638;</span><span data-text="file"></span></div>
      <div class="popup-stats" data-show="hasStats">
        <div class="popup-stat"><b data-text="n1"></b><span data-text="l1"></span></div>
        <div class="popup-stat"><b data-text="n2"></b><span data-text="l2"></span></div>
        <div class="popup-stat"><b data-text="n3"></b><span data-text="l3"></span></div>
      </div>
      <p data-text="text"></p>
      <div class="popup-actions">
        <button type="button" class="btn ghost" id="confirm-no" data-text="noLabel"></button>
        <button type="button" class="btn" id="confirm-yes" data-text="yesLabel"></button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-alert">
  <div class="alert" data-class="cls" role="status" data-text="text"></div>
</template>

<template id="tpl-message">
  <div class="card center">
    <h2 data-text="title"></h2>
    <p class="muted" data-text="text"></p>
    <a class="btn" data-attr="href:href" data-text="label"></a>
  </div>
</template>

<template id="tpl-courselist">
  <div class="grid3" data-list="courses" data-item-template="tpl-coursecard"></div>
  <div class="card muted" data-show="empty" data-text="emptyText"></div>
</template>

<template id="tpl-coursecard">
  <div class="card course">
    <div class="row between">
      <span class="muted small" data-text="category"></span>
      <span class="badge" data-class="statusCls" data-text="statusLabel"></span>
    </div>
    <h3 data-text="title"></h3>
    <p class="muted" data-text="description"></p>
    <p class="small" data-text="meta"></p>
    <div class="pb" role="progressbar"><div class="pb-fill" data-width="pct"></div></div>
    <div class="row between">
      <span class="small" data-text="progressText"></span>
      <a class="btn" data-attr="href:href" data-text="button"></a>
    </div>
  </div>
</template>

<!-- ============ EMPLOYEE LAYOUT AND NAVBAR ============ -->
<template id="tpl-employee-layout">
  <div data-slot="navbar"></div>
  <main class="page" data-slot="page"></main>
</template>

<template id="tpl-navbar">
  <header class="navbar">
    <div class="nav-in">
      <a href="#/home" class="logo"><img class="logo-img" src="img/logo-mark.png" alt=""> Leads Training</a>
      <button class="burger" aria-label="Menu" onclick="toggle('lnk','open')">☰</button>
      <nav id="lnk" class="links" data-list="links">
        <template><a data-attr="href:href" data-class="cls" data-text="label"></a></template>
      </nav>
      <div class="nav-right">
        <button class="theme-btn" type="button" aria-label="Switch between light and night theme" title="Light / Night theme" onclick="toggleTheme()">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <div class="pop-wrap">
          <button class="icon-btn" aria-label="Notifications" onclick="openNotes()">🔔<span class="count" id="cnt" data-show="unread" data-text="unread"></span></button>
          <div id="pn" class="pop hidden">
            <p class="muted small" data-show="noNotes">No notifications.</p>
            <div data-list="notes">
              <template>
                <div class="note"><b data-text="title"></b><div class="small" data-text="message"></div><div class="muted small" data-text="date"></div><a class="small" data-show="hasLink" data-attr="href:linkHref" data-text="linkText" onclick="toggle('pn')"></a></div>
              </template>
            </div>
          </div>
        </div>
        <div class="pop-wrap">
          <button class="icon-btn gear-btn" type="button" aria-label="Settings" title="Settings" onclick="toggle('ps')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <div id="ps" class="pop small-pop hidden">
            <button onclick="menuGo('/profile')">Profile &amp; Settings</button>
            <button onclick="menuGo('/support','faq')">Help</button>
            <button onclick="menuGo('/support','contact')">Contact Support</button>
            <button onclick="logout()">Log Out</button>
          </div>
        </div>
        <a href="#/profile" class="user-btn" title="My profile"><span class="avatar" data-text="initial"></span><span class="uname" data-text="name"></span></a>
      </div>
    </div>
  </header>
</template>

<!-- ============ HOME ============ -->
<template id="tpl-home">
  <h1>Welcome back, <span data-text="firstName"></span>!</h1>
  <p class="muted">Continue your assigned training and complete your required courses.</p>
  <div class="grid4" data-list="stats">
    <template>
      <div class="card stat"><div class="muted small" data-text="label"></div><div class="big" data-text="value"></div></div>
    </template>
  </div>
  <h2>Continue Training</h2>
  <div class="card" data-show="hasActive">
    <h3 data-text="activeTitle"></h3>
    <div class="small" data-text="overallText"></div>
    <div class="pb"><div class="pb-fill" data-width="overall"></div></div>
    <p><span data-text="currentText"></span> <span class="type" data-text="curType"></span></p>
    <div class="small" data-text="cardPctText"></div>
    <div class="pb"><div class="pb-fill" data-width="cardPct"></div></div>
    <p><a class="btn" data-attr="href:continueLink">Continue Training</a></p>
  </div>
  <div class="card muted" data-show="noActive" data-text="noActiveText"></div>
  <h2>My Courses</h2>
  <div data-slot="courses"></div>
</template>

<!-- ============ COURSES ============ -->
<template id="tpl-courses">
  <h1>My Courses</h1>
  <input class="search" placeholder="Search by course name or category" data-value="search" oninput="ui.search=this.value;drawCourses()" aria-label="Search courses">
  <div class="tabs" data-list="tabs">
    <template><button data-class="cls" data-text="label" data-attr="data-t:label" onclick="setTab(this.dataset.t)"></button></template>
  </div>
  <div data-slot="list"></div>
</template>

<!-- ============ COURSE DETAIL ============ -->
<template id="tpl-detail">
  <p><a href="#/courses" data-attr="href:coursesHref">← Courses</a></p>
  <div class="alert orange" role="alert" data-show="flash" data-text="flash"></div>
  <h1 data-text="title"></h1>
  <p class="muted" data-text="description"></p>
  <p class="small"><span data-text="meta"></span> <span class="badge" data-class="statusCls" data-text="statusLabel"></span></p>
  <div class="alert green" data-show="completed"><b>Congratulations!</b> <span data-text="congrats"></span></div>
  <div class="card">
    <div class="small" data-text="progressText"></div>
    <div class="pb"><div class="pb-fill" data-width="pct"></div></div>
  </div>
  <h2>Training Cards</h2>
  <div class="card muted" data-show="noCards">This course has no training cards yet.</div>
  <div data-list="cards">
    <template>
      <a class="card row between linkcard" data-class="cls" data-attr="href:href; aria-disabled:ariaDisabled">
        <div>
          <div class="small muted" data-text="no"></div>
          <b data-text="title"></b> <span class="type" data-text="type"></span>
          <div class="small muted" data-show="attempts" data-text="attempts"></div>
          <div class="small muted" data-show="locked">Locked: pass the previous card first.</div>
          <div class="small" data-show="cardPct" data-text="cardPct"></div>
        </div>
        <span class="badge" data-class="statusCls" data-text="statusLabel"></span>
      </a>
    </template>
  </div>
</template>

<!-- ============ TRAINING CARD ============ -->
<template id="tpl-training">
  <p><a data-attr="href:backLink" data-text="backText"></a></p>
  <div class="small muted" data-hide="isEval" data-text="cardNo"></div>
  <h1 data-hide="isEval"><span data-text="title"></span> <span class="type" data-text="type"></span></h1>
  <div class="small" data-hide="isEval">Card progress: <span id="cp" data-text="pct"></span>%</div>
  <div class="pb" data-hide="isEval"><div class="pb-fill" id="cbar" data-width="pct"></div></div>
  <div data-slot="body"></div>
</template>

<template id="tpl-read">
  <h2>Learning Material</h2>
  <div class="alert green" data-show="passed">You already passed this card. You can review the material below.</div>
  <div class="small row between"><span>Reading Progress</span><span id="rtxt" data-text="readingText"></span></div>
  <div class="pb"><div class="pb-fill" id="rbar" data-width="reading"></div></div>
  <div class="reader" id="reader" tabindex="0" data-list="blocks">
    <template>
      <h3 data-show="isH" data-text="text"></h3>
      <p data-show="isP" data-text="text"></p>
      <ul data-show="isUl" data-list="items"><template><li data-text="text"></li></template></ul>
      <ol data-show="isOl" data-list="items"><template><li data-text="text"></li></template></ol>
      <div class="alert orange" data-show="isWarn"><b>Important:</b> <span data-text="text"></span></div>
      <figure class="media" data-show="isVideo"><video controls preload="metadata" playsinline data-attr="src:src"></video><figcaption data-text="cap"></figcaption></figure>
      <figure class="media" data-show="isImg"><img alt="" data-attr="src:src"><figcaption data-text="cap"></figcaption></figure>
    </template>
  </div>
  <p>
    <span class="alert red" data-show="noQuiz">This card has no quiz questions yet.</span>
    <a class="btn" data-show="passed" data-attr="href:backLink">Back to course</a>
    <button class="btn" id="startBtn" onclick="startQuiz()" data-show="canStart" data-attr="disabled:startDisabled" data-text="startLabel"></button>
    <span class="muted small" id="hint" data-show="canStart" data-text="hint"></span>
  </p>
  <div class="card" data-show="hasMine">
    <h3>Your evaluations</h3>
    <p class="small muted">Evaluate a supplier again to replace your earlier evaluation of it in the same quarter.</p>
    <div data-list="mine">
      <template>
        <div class="row between" style="padding:8px 0;border-top:1px solid var(--line, #e5e7eb)">
          <div><b data-text="name"></b><div class="small muted" data-text="info"></div></div>
          <button class="btn ghost" data-attr="data-id:id" onclick="evalRedo(this.dataset.id)">Evaluate again</button>
        </div>
      </template>
    </div>
  </div>
</template>

<template id="tpl-quiz">
  <div class="card">
    <div class="small muted" data-text="progressText"></div>
    <h2 data-text="question"></h2>

<template id="tpl-evaluation">

    <p class="muted small">Only Leads employees fill in this form. Suppliers never answer it.</p>
    <div id="everr"></div>
    <h3>Supplier Information</h3>
    <label>Supplier Name *
      <select name="supplierId" id="ev-supplier" required onchange="evalSupplier()" data-list="suppliers">
        <option value="">Select a supplier</option>
        <template><option data-attr="value:id" data-text="name"></option></template>
      </select>
    </label>
    <div class="alert orange hidden" id="ev-dup">You already evaluated this supplier in this quarter. Use "Request re-evaluation" under Your evaluations to ask your supervisor for permission.</div>
    <label>Supplier Category<input id="ev-category" readonly></label>
    <label>Contact Person<input id="ev-person" readonly></label>
    <label>Contact No.<input id="ev-phone" readonly></label>
    <label>Email<input id="ev-email" readonly></label>
    <label>Service / Product Provided *<input name="service" required maxlength="160"></label>
    <label>Supplier Criticality *
      <select name="criticality" required><option value="">Select</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
    </label>
    <label>Evaluation Date *<input type="date" name="evaluationDate" required data-value="today" data-attr="max:today; min:qStart" onchange="evalPeriod()"></label>
    <label>Evaluation Period (fixed quarter)<input id="ev-period" readonly data-value="periodText"></label>
    <p class="small muted">Each supplier can be evaluated once per quarter. To evaluate it again, request permission from your supervisor.</p>
    <label>Evaluator<input data-value="evaluator" readonly></label>

    <h3>Supplier Performance</h3>
    <p class="muted small">Rate each criterion from 1 (poor) to 5 (excellent). The weight shows how much the rating counts in the overall score.</p>
    <div data-list="fields">
      <template>
        <div class="card">
          <b data-text="label"></b> <span class="badge gray" data-text="weightText"></span>
          <p class="small muted" data-text="description"></p>
          <div class="row wrap">
            <label class="check"><input type="radio" data-attr="name:rname" value="1" required onchange="evalPreview()"> 1</label>
            <label class="check"><input type="radio" data-attr="name:rname" value="2" onchange="evalPreview()"> 2</label>
            <label class="check"><input type="radio" data-attr="name:rname" value="3" onchange="evalPreview()"> 3</label>
            <label class="check"><input type="radio" data-attr="name:rname" value="4" onchange="evalPreview()"> 4</label>
            <label class="check"><input type="radio" data-attr="name:rname" value="5" onchange="evalPreview()"> 5</label>
          </div>
        </div>
      </template>
    </div>
    <div class="alert blue" id="ev-preview">Rate all criteria to see the estimated score.</div>

    <h3>Evaluation Result</h3>
    <p><b data-text="meetsLabel"></b></p>
    <div class="row wrap"><label class="check"><input type="radio" name="meets" value="Yes" required> Yes</label><label class="check"><input type="radio" name="meets" value="Partially" required> Partially</label><label class="check"><input type="radio" name="meets" value="No" required> No</label></div>
    <p><b>2. Were there significant issues during the evaluation period? *</b></p>
    <div class="row wrap"><label class="check"><input type="radio" name="issues" value="Yes" required> Yes</label><label class="check"><input type="radio" name="issues" value="No" required> No</label></div>
    <p><b>3. Is corrective action required? *</b></p>
    <div class="row wrap"><label class="check"><input type="radio" name="corrective" value="Yes" required onchange="evalCorrective()"> Yes</label><label class="check"><input type="radio" name="corrective" value="No" required onchange="evalCorrective()"> No</label></div>
    <label>4. Recommendation *
      <select name="recommendation" required onchange="evalRecommendation()">
        <option value="">Select</option><option>Continue Supplier</option><option>Continue with Monitoring</option><option>Corrective Action Required</option><option>Management Review</option><option>Consider Replacement</option><option>Other</option>
      </select>
    </label>
    <input name="recommendationOther" id="ev-other" class="hidden" placeholder="Write your recommendation">
    <label>5. Evaluator Comments *<textarea name="comments" rows="3" required></textarea></label>

    <div id="ev-corrective" class="card hidden">
      <h3>Corrective Action</h3>
      <label>Issue Identified and Corrective Action Needed *<textarea name="issueIdentified" rows="3"></textarea></label>
      <p class="small muted">Your supervisor is notified on the site. They and the administrator record the supplier response, target date and responsible person.</p>
    </div>
    <div class="row"><button class="btn">Submit Evaluation</button><a class="btn ghost" data-attr="href:backHref">Back to evaluation</a></div>
  </form>
</template>

    <div class="kpi-bar-scale small muted"><span class="s0">0%</span><span class="s80">80%</span><span class="s90">90%</span><span class="s100">100%</span></div>
    <p class="small muted kpi-band-text" data-text="bandText"></p>
    <p class="small kpi-warn" data-show="warn" data-text="warn"></p>
  </div>
  <p class="card muted center" data-show="empty" data-text="emptyText"></p>
  <form id="kpi-results" onsubmit="kpiSaveResults(event)" data-hide="empty">
    <div class="card kpi-matrix-card scroll">
      <table class="kpi-matrix">
        <thead><tr><th class="c-no">#</th><th>KRA / Specific KPI</th><th class="num">KPI Weight</th><th class="num">Target</th><th>Actual</th><th class="num">Reached</th><th class="num">Weighted Score</th><th>Status</th></tr></thead>
        <tbody data-list="rows">
          <template>
            <tr data-class="cls">
              <td class="mx-kra-cell" colspan="8" data-show="isKra">
                <div class="mx-kra"><span class="kra-no" data-text="no"></span><b data-text="name"></b><span class="muted small" data-text="meta"></span><span class="badge mx-band" data-class="bandCls" data-text="bandLabel"></span></div>
                <div class="small kpi-warn" data-show="note" data-text="note"></div>
              </td>
              <td class="c-no" data-hide="isKra" data-text="no"></td>
              <td data-hide="isKra"><div class="mx-name" data-text="name"></div><div class="small muted" data-show="sla" data-text="sla"></div><div class="small muted" data-show="evidence" data-text="evidence"></div></td>
              <td class="num" data-hide="isKra" data-text="weight"></td>
              <td class="num" data-hide="isKra" data-text="target"></td>
              <td data-hide="isKra">
                <span class="mx-actual" data-show="isKpi">
                  <b class="mx-actual-val" data-text="actualText"></b>
                  <button type="button" class="calc-btn" data-attr="data-id:id; disabled:locked" onclick="kpiCalcOpen(this.dataset.id)" title="Open the KPI Calculation Assistant" aria-label="Open the KPI Calculation Assistant">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 7h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>
                  </button>
                </span>
              </td>
              <td class="num" data-hide="isKra" data-text="reached"></td>
              <td class="num" data-hide="isKra" data-text="earned"></td>
              <td data-hide="isKra"><span class="badge" data-show="status" data-class="statusCls" data-text="status"></span></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <div class="kpi-savebar">
      <div id="kresmsg" class="grow"></div>
      <span class="small muted">Results come from the KPI Calculation Assistant: press the calculator button next to a KPI, compute the score and apply it.</span>
    </div>
  </form>
  <details class="card kpi-how"><summary>How the computation works</summary>
    <ul data-list="how"><template><li data-text="t"></li></template></ul>
  </details>
</template>

<!-- KPI Calculation Assistant (opens from the calculator button next to a KPI's Actual box) -->
<template id="tpl-kpi-calc">
  <div class="kc-overlay" onclick="if(event.target===this)kpiCalcClose()">
    <div class="kc-modal" role="dialog" aria-modal="true" aria-labelledby="kc-title">
      <header class="kc-head">
        <div class="kc-head-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 7h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg></div>
        <div><h2 id="kc-title">KPI Calculation Assistant</h2><p data-text="subtitle"></p></div>
        <button type="button" class="kc-x" aria-label="Close" onclick="kpiCalcClose()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <div class="kc-body">
        <div class="kc-metric"><span class="kc-cap">Selected Metric</span><b data-text="name"></b></div>
        <p class="kc-label">Select Formula Calculation Model</p>
        <div class="kc-models" role="radiogroup" aria-label="Formula calculation model">
          <button type="button" class="kc-model on" role="radio" aria-checked="true" data-m="ratio" onclick="kcModel('ratio')"><span class="kc-mt"><span class="kc-mi">%</span>Ratio %</span><small>Met / Total SLA</small></button>
          <button type="button" class="kc-model" role="radio" aria-checked="false" data-m="uptime" onclick="kcModel('uptime')"><span class="kc-mt"><svg class="kc-mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>Uptime</span><small>Hours - Downtime</small></button>
          <button type="button" class="kc-model" role="radio" aria-checked="false" data-m="csat" onclick="kcModel('csat')"><span class="kc-mt"><svg class="kc-mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>CSAT Survey</span><small>Rating / Star Score</small></button>
          <button type="button" class="kc-model" role="radio" aria-checked="false" data-m="direct" onclick="kcModel('direct')"><span class="kc-mt"><svg class="kc-mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>Direct / Preset</span><small>Fast % Slider</small></button>
        </div>

        <section class="kc-panel" id="kc-p-ratio">
          <div class="kc-ptop"><b>Percentage Formula: (Compliant ÷ Total Volume)</b><span class="kc-tag">Actual = N / D</span></div>
          <div class="kc-two">
            <label>Successful / Within SLA (Numerator)<input id="kc-num" type="number" step="any" min="0" oninput="kcUpdate()"></label>
            <label>Total Tickets / Audits (Denominator)<input id="kc-den" type="number" step="any" min="0" oninput="kcUpdate()"></label>
          </div>
          <div class="kc-presets"><span>Presets:</span><button type="button" onclick="kcPreset(95,100)">95 / 100</button><button type="button" onclick="kcPreset(192,200)">192 / 200 (96%)</button><button type="button" onclick="kcPreset(48,50)">48 / 50</button></div>
        </section>

        <section class="kc-panel hidden" id="kc-p-uptime">
          <div class="kc-ptop"><b>Uptime Formula: (Total Hours − Downtime) ÷ Total Hours</b><span class="kc-tag">Actual = (T − D) / T</span></div>
          <div class="kc-two">
            <label>Total Hours in the Period<input id="kc-up-total" type="number" step="any" min="0" oninput="kcUpdate()"></label>
            <label>Downtime (Hours)<input id="kc-up-down" type="number" step="any" min="0" oninput="kcUpdate()"></label>
          </div>
          <div class="kc-presets"><span>Presets:</span><button type="button" onclick="kcPreset(720,0)">720 h / 0 h</button><button type="button" onclick="kcPreset(720,0.72)">720 h / 0.72 h (99.9%)</button><button type="button" onclick="kcPreset(744,7.44)">744 h / 7.44 h (99%)</button></div>
        </section>

        <section class="kc-panel hidden" id="kc-p-csat">
          <div class="kc-ptop"><b>CSAT Formula: (Average Rating ÷ Maximum Rating)</b><span class="kc-tag">Actual = R / M</span></div>
          <div class="kc-two">
            <label>Average Rating / Star Score<input id="kc-cs-rating" type="number" step="any" min="0" oninput="kcUpdate()"></label>
            <label>Maximum Rating<input id="kc-cs-max" type="number" step="any" min="0" oninput="kcUpdate()"></label>
          </div>
          <div class="kc-presets"><span>Presets:</span><button type="button" onclick="kcPreset(4.5,5)">4.5 / 5 (90%)</button><button type="button" onclick="kcPreset(4.75,5)">4.75 / 5 (95%)</button><button type="button" onclick="kcPreset(5,5)">5 / 5</button></div>
        </section>

        <section class="kc-panel hidden" id="kc-p-direct">
          <div class="kc-ptop"><b>Direct Entry: type or slide the percentage</b><span class="kc-tag">Actual = X</span></div>
          <div class="kc-two">
            <label>Result (%)<input id="kc-direct" type="number" step="any" min="0" max="100" oninput="kcDirectType()"></label>
            <label>Fast % Slider<input id="kc-slider" type="range" min="0" max="100" step="0.1" value="0" oninput="kcSlide(this.value)"></label>
          </div>
          <div class="kc-presets"><span>Presets:</span><button type="button" onclick="kcPreset(90)">90%</button><button type="button" onclick="kcPreset(95)">95%</button><button type="button" onclick="kcPreset(99.9)">99.9%</button><button type="button" onclick="kcPreset(100)">100%</button></div>
        </section>
        <p class="small kpi-warn" id="kc-hint"></p>

        <div class="kc-out">
          <div>
            <span class="kc-cap kc-cap-lt">Computed Actual Score</span>
            <div class="kc-big"><span id="kc-score">--</span><span class="kc-raw" id="kc-raw"></span></div>
            <div class="kc-target"><span id="kc-target"></span> <span id="kc-verdict"></span></div>
          </div>
          <div class="kc-sync"><span class="kc-cap kc-cap-lt">Sheets Sync</span><span class="kc-auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Auto-Recalculate</span></div>
        </div>
        <div id="kc-err"></div>
      </div>
      <footer class="kc-foot">
        <button type="button" class="kc-cancel" onclick="kpiCalcClose()">Cancel</button>
        <div class="row">
          <button type="button" class="btn ghost" id="kc-next" onclick="kcApply(true)">Apply &amp; Next KPI <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
          <button type="button" class="btn" id="kc-apply" onclick="kcApply(false)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Apply to Spreadsheet</button>
        </div>
      </footer>
    </div>
  </div>
</template>

<!-- Setup: KRAs and KPIs -->
<template id="tpl-kpi-setup">
  <div class="kpi-sec-head"><div><h2 data-text="posName"></h2><p class="small muted" data-text="posInfo"></p></div><button class="btn" onclick="kpiKraForm()">+ Add KRA</button></div>
  <div data-slot="kform"></div>
  <p class="card muted center" data-show="noKras">This position has no KRAs yet. Press <b>+ Add KRA</b>.</p>
  <div data-list="kras">
    <template>
      <div class="card kpi-kra">
        <div class="kra-head">
          <div class="kra-title"><span class="kra-no" data-text="no"></span><div><h3 data-text="name"></h3><div class="small muted"><span data-text="weightText"></span><span data-show="note"> · <span data-text="note"></span></span></div></div></div>
          <div class="kra-btns">
            <button class="btn sm" data-attr="data-id:id" onclick="kpiKpiForm(this.dataset.id)">+ Add KPI</button>
            <button class="btn ghost sm" data-attr="data-id:id" onclick="kpiKraForm(this.dataset.id)">Edit KRA</button>
            <button class="btn ghost danger sm" data-attr="data-id:id" onclick="kpiDeleteKra(this.dataset.id)">Delete KRA</button>
          </div>
        </div>
        <p class="small muted" data-show="noKpis">No KPI yet in this KRA.</p>
        <div class="scroll" data-hide="noKpis">
          <table class="kpi-table">
            <thead><tr><th>No.</th><th>Specific KPI</th><th class="num">KPI Weight</th><th class="num">Target</th><th></th></tr></thead>
            <tbody data-list="kpis">
              <template>
                <tr>
                  <td data-text="no"></td>
                  <td><b data-text="name"></b> <span class="badge gray" data-show="inactive">Inactive</span><div class="small muted" data-show="sla" data-text="sla"></div></td>
                  <td class="num" data-text="weight"></td>
                  <td class="num" data-text="target"></td>
                  <td class="nowrap tr">
                    <button class="btn ghost sm" data-attr="data-kra:kra; data-id:id" onclick="kpiKpiForm(this.dataset.kra,this.dataset.id)">Edit</button>
                    <button class="btn ghost danger sm" data-attr="data-id:id" onclick="kpiDeleteKpi(this.dataset.id)">Delete</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>
  <div data-slot="scale"></div>
</template>

<template id="tpl-kpi-scale">
  <details class="card kpi-scale-box" data-attr="open:isOpen">
    <summary>Partial-credit scale (optional, only if management approved it)</summary>
    <form class="form" id="kpi-scale" onsubmit="kpiSaveScale(event)">
      <p class="small muted">When a KPI is below its target, the part of the target it reached (result ÷ target, or target ÷ result when lower is better) decides the share of the KPI weight that is earned. Example: reached at least 90% of the target earns 50% of the weight. Without a scale, a KPI below target earns 0.</p>
      <p class="small muted" data-show="noRows">No scale: KPIs below target earn nothing.</p>
      <div data-list="rows">
        <template>
          <div class="row scrow">
            <label>Reached at least (%)<input type="number" step="any" min="0" max="100" data-f="min" data-value="min"></label>
            <label>Earns (% of weight)<input type="number" step="any" min="0" max="100" data-f="credit" data-value="credit"></label>
            <button type="button" class="btn ghost danger sm" data-attr="data-i:i" onclick="kpiDelScaleRow(this.dataset.i)">Remove</button>
          </div>
        </template>
      </div>
      <div id="ksmsg"></div>
      <div class="row"><button type="button" class="btn ghost" onclick="kpiAddScaleRow()">+ Add row</button><button class="btn">Save scale</button></div>
    </form>
  </details>
</template>

<template id="tpl-kpi-kra-form">
  <form class="card form" onsubmit="kpiSaveKra(event,this.dataset.id)" data-attr="data-id:id">
    <h3 data-text="heading"></h3>
    <div id="kkerr"></div>
    <div class="row kpi-two">
      <label>KRA No.<input id="kr-no" type="number" min="1" step="1" data-value="no"></label>
      <label>KRA Weight (%)<input id="kr-weight" type="number" step="any" min="0.01" max="100" data-value="weight" oninput="kpiCap(this)"></label>
    </div>
    <label>KRA<input id="kr-name" maxlength="160" placeholder="e.g. IT Service Delivery" data-value="name"></label>
    <p class="small muted" data-text="hint"></p>
    <div class="row"><button class="btn">Save KRA</button><button type="button" class="btn ghost" onclick="kpiCloseForm('kform')">Cancel</button></div>
  </form>
</template>

<!-- Add / edit a KPI: the same columns as the matrix sheet (Specific KPI, KPI Weight, Target) -->
<template id="tpl-kpi-form">
  <form class="card form" onsubmit="kpiSaveKpi(event,this.dataset.id,this.dataset.kra)" data-attr="data-id:id; data-kra:kra">
    <h3 data-text="heading"></h3>
    <div id="kkerr"></div>
    <label data-show="pickKra">KRA
      <select id="kk-kra" data-list="kraOpts" onchange="kpiKpiForm(this.value)"><template><option data-attr="value:id" data-text="label"></option></template></select>
    </label>
    <label>Specific KPI<input id="kk-name" maxlength="200" placeholder="e.g. Overall Ticket Performance / SLA" data-value="name"></label>
    <div class="row kpi-two">
      <label>KPI Weight (%)<input id="kk-weight" type="number" step="any" min="0" placeholder="Shared equally" data-value="customWeight" oninput="kpiCap(this)"></label>
      <label>Target (%)<input id="kk-target" type="number" step="any" min="0" max="100" data-value="target"></label>
    </div>
    <p class="small muted" data-text="hint"></p>
    <div class="row"><button class="btn">Save KPI</button><button type="button" class="btn ghost" onclick="kpiCloseForm('kform')">Cancel</button></div>
  </form>
</template>

<!-- SLA -->
<template id="tpl-kpi-sla">
  <div class="kpi-sec-head"><div><h2>Service Level Agreement (SLA)</h2><p class="small muted">The SLA priorities and their first response and resolution targets. Add a priority, edit it, or remove it.</p></div><button class="btn" onclick="kpiSlaForm()">+ Add priority</button></div>
  <div data-slot="slaform"></div>
  <div data-slot="slatable"></div>
</template>

<template id="tpl-kpi-sla-form">
  <form class="card form" onsubmit="kpiSaveSla(event,this.dataset.original)" data-attr="data-original:original">
    <h3 data-text="heading"></h3>
    <div id="kserr"></div>
    <label>Priority<input id="ks-name" maxlength="40" placeholder="e.g. Critical" data-value="priority"></label>
    <label>Description<textarea id="ks-desc" rows="2" data-value="description"></textarea></label>
    <label>Examples<textarea id="ks-examples" rows="2" data-value="examples"></textarea></label>
    <div class="row kpi-two">
      <label>First response<input id="ks-first" maxlength="40" placeholder="e.g. 5 minutes" data-value="firstResponse"></label>
      <label>Resolution target<input id="ks-resolution" maxlength="40" placeholder="e.g. 2 hours" data-value="resolution"></label>
    </div>
    <div class="row"><button class="btn">Save</button><button type="button" class="btn ghost" onclick="kpiCloseForm('slaform')">Cancel</button></div>
  </form>
</template>

<template id="tpl-kpi-guide">
  <h2>ICT KPI Management Guide - 2026</h2>
  <div class="card scroll"><table class="kpi-table"><tbody data-list="rows"><template><tr><th class="kpi-k" data-text="k"></th><td data-text="v"></td></tr></template></tbody></table></div>
  <h3>Important controls</h3>
  <div class="card"><ul data-list="controls"><template><li data-text="t"></li></template></ul></div>
  <h3>How to use this tab</h3>
  <div class="card"><ol data-list="steps"><template><li data-text="t"></li></template></ol></div>
</template>
